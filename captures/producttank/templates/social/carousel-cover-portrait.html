<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>carousel-cover · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="carousel-cover">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="-60" cy="300" r="380"/><circle class="stroke-zingy" cx="900" cy="1300" r="301" stroke-width="38"/><circle class="stroke-zingy" cx="900" cy="1300" r="211" stroke-width="38"/><circle class="stroke-zingy" cx="900" cy="1300" r="122" stroke-width="38"/><circle class="fill-zingy" cx="900" cy="1300" r="38"/><circle class="stroke-purple" cx="1080" cy="700" r="226" stroke-width="29"/></svg>
<figure class="photo subject" data-slot="photo" style="right:0;bottom:0;width:520px;height:640px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Subject photo slot: the person recommending, a cut-out bleeding off the bottom edge" style="width:100%;height:100%;opacity:.18"></figure>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 360px">
  <h1 class="headline" data-slot="headline">What gets our<br>brains in motion</h1>
  <p class="subheading" data-slot="body" style="margin-top: var(--space-6); max-width: 800px">Content our community turns to for learning and inspiration</p>
  <div style="display:flex;align-items:center;gap:var(--space-6);margin-top: var(--space-10)"><span class="pill" data-slot="cta">Swipe to see</span><svg class="shape" data-derived-art="shape" data-markup="arrow" viewBox="0 0 225 225" preserveAspectRatio="none" fill="currentColor" style="width:140px;height:80px;color:var(--action);flex:none" aria-hidden="true"><path d="M18,120 C90,112 150,108 200,104" stroke="currentColor" stroke-width="26" stroke-linecap="round" fill="none"/><path d="M150,58 L206,104 L146,152" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
  <p class="body" data-slot="attribution" style="margin-top: var(--space-16); max-width: 480px">Recommendations from<br><span class="bold">Firstname Lastname</span><br>Product designer @ Acme</p>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
