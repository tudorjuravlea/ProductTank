<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>team-member · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="team-member">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="stroke-zingy" cx="1020" cy="160" r="244" stroke-width="31"/><circle class="stroke-zingy" cx="1020" cy="160" r="172" stroke-width="31"/><circle class="stroke-zingy" cx="1020" cy="160" r="99" stroke-width="31"/><circle class="fill-zingy" cx="1020" cy="160" r="31"/><circle class="fill-blurple" cx="180" cy="1300" r="300"/><circle class="stroke-purple" cx="1040" cy="1100" r="282" stroke-width="36"/></svg>
<figure class="photo subject" data-slot="photo" style="right:0;bottom:0;width:620px;height:900px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Team member photo slot: a head-and-shoulders cut-out bleeding off the bottom edge" style="width:100%;height:100%;opacity:.18"></figure>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 380px">
  <span class="pill" data-slot="label">Meet the team</span>
  <div class="bar-markup" data-markup="bar" style="margin-top: var(--space-10); max-width: 560px">
    <h1 class="headline" data-slot="headline">Firstname<br>Lastname</h1>
    <p class="subheading" data-slot="role" style="margin-top: var(--space-6)">Product consultant @ Acme, trainer and facilitator</p>
  </div>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
