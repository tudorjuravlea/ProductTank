<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>call-for · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="call-for">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="940" cy="1100" r="440"/><circle class="stroke-zingy" cx="260" cy="1000" r="244" stroke-width="31"/><circle class="stroke-zingy" cx="260" cy="1000" r="172" stroke-width="31"/><circle class="stroke-zingy" cx="260" cy="1000" r="99" stroke-width="31"/><circle class="fill-zingy" cx="260" cy="1000" r="31"/><circle class="stroke-purple" cx="1000" cy="520" r="263" stroke-width="34"/></svg>
<div class="copy">
  <span class="pill" data-slot="label">Call for speakers</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Share what works<br>(and what<br><span class="markup" data-markup="box">doesn't</span>)</h1>
  <p class="subheading" data-slot="body" style="margin-top: var(--space-8); max-width: 760px">Twenty minutes, one story from your product work, and a room that wants it.</p>
  <p class="body medium" data-slot="rsvp" style="margin-top: var(--space-8)">Propose a talk: message the organisers on Meetup.</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="380"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
