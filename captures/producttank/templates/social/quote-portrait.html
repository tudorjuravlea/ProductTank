<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>quote · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="quote">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="960" cy="1180" r="400"/><circle class="stroke-zingy" cx="180" cy="1080" r="226" stroke-width="29"/><circle class="stroke-zingy" cx="180" cy="1080" r="158" stroke-width="29"/><circle class="stroke-zingy" cx="180" cy="1080" r="91" stroke-width="29"/><circle class="fill-zingy" cx="180" cy="1080" r="29"/><circle class="stroke-purple" cx="1000" cy="560" r="263" stroke-width="34"/></svg>
<div class="copy" style="top: 200px">
  <span class="pill" data-slot="label">From the stage</span>
  <blockquote class="quote" data-slot="quote" style="margin-top: var(--space-8); max-width: 840px">“Saying no is a product skill. Saying it early is a leadership skill.”</blockquote>
  <p class="subheading" data-slot="attribution" style="margin-top: var(--space-8)">Firstname Lastname, Head of Product at Acme</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="380"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
