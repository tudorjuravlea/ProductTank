<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>event-promo · landscape</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="social-landscape" data-archetype="event-promo">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1200 628" width="1200" height="628" aria-hidden="true"><circle class="fill-blurple" cx="1120" cy="96" r="176"/><circle class="stroke-zingy" cx="1140" cy="600" r="141" stroke-width="18"/><circle class="stroke-zingy" cx="1140" cy="600" r="99" stroke-width="18"/><circle class="stroke-zingy" cx="1140" cy="600" r="57" stroke-width="18"/><circle class="fill-zingy" cx="1140" cy="600" r="18"/><circle class="stroke-blurple" cx="700" cy="660" r="150" stroke-width="19"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="240"></div>
<div class="copy" style="top: 176px; right: 480px">
  <div class="highlight" data-slot="highlight"><span>Tuesday 14 October</span><span>18:30</span></div>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6); font-size: 52px">Saying no without losing the room</h1>
  <p class="body medium" data-slot="facts" style="margin-top: var(--space-5)">Venue name, Brussels</p>
  <p class="body-sm" data-slot="rsvp" style="margin-top: var(--space-3)">Free to attend. RSVP on Meetup.</p>
</div>
<div style="position:absolute;left:var(--space-16);bottom:var(--space-16);z-index:3"><div class="sponsor-box caption" data-slot="sponsor-logo">Host logo</div></div>
<div style="position:absolute;right:var(--space-16);top:200px;z-index:2;display:flex;flex-direction:column;gap:var(--space-8)" data-slot="lineup">
  <div class="speaker" data-slot="speaker"><div class="portrait" style="width:96px;height:96px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></div><div><p class="subheading bold" data-slot="speaker-name">Firstname Lastname</p><p class="body-sm" data-slot="role">Head of Product</p><p class="body-sm medium" data-slot="company">@ Acme</p></div></div>
  <div class="speaker" data-slot="speaker"><div class="portrait" style="width:96px;height:96px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></div><div><p class="subheading bold" data-slot="speaker-name">Firstname Lastname</p><p class="body-sm" data-slot="role">Product manager</p><p class="body-sm medium" data-slot="company">@ Beta</p></div></div>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
