<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>speaker-tease · square</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-square" data-archetype="speaker-tease">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1080" width="1080" height="1080" aria-hidden="true"><circle class="stroke-zingy" cx="1000" cy="140" r="282" stroke-width="36"/><circle class="stroke-zingy" cx="1000" cy="140" r="198" stroke-width="36"/><circle class="stroke-zingy" cx="1000" cy="140" r="114" stroke-width="36"/><circle class="fill-zingy" cx="1000" cy="140" r="36"/><circle class="fill-blurple" cx="-40" cy="1120" r="300"/><circle class="stroke-purple" cx="1040" cy="1000" r="244" stroke-width="31"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<figure class="portrait-circle" data-slot="photo" style="right:var(--space-16);top:400px;width:360px;height:360px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></figure>
<div class="copy" style="top: 400px; right: 480px">
  <div style="display:flex;align-items:flex-end;gap:var(--space-4)"><p class="subheading bold" data-slot="label">Meet the next speaker</p><svg class="shape" data-derived-art="shape" data-markup="exclamation" viewBox="0 0 225 225" preserveAspectRatio="none" fill="currentColor" style="width:48px;height:88px;color:var(--action);flex:none" aria-hidden="true"><path fill="none" d="M116,20 L108,150" stroke="currentColor" stroke-width="30" stroke-linecap="round"/><circle cx="106" cy="196" r="17"/></svg></div>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Firstname<br>Lastname</h1>
  <p class="subheading" data-slot="role" style="margin-top: var(--space-6)">Head of Product @ Acme</p>
</div>
<div style="position:absolute;left:var(--space-16);bottom:var(--space-16);z-index:2"><div class="highlight" data-slot="highlight"><span>December</span><span>Stay tuned for updates</span></div></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
