<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>milestone · portrait · counter · gradient</title>

<style></style></head><body>
<main class="canvas ground-gradient" data-format="social-portrait" data-archetype="milestone">

<div class="copy" style="top: 420px">
  <ul class="facts icons body medium" data-slot="facts"><li><svg viewBox="0 0 24 24" data-derived-art="icon" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Since 2023</span></li><li><svg viewBox="0 0 24 24" data-derived-art="icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Free to attend</span></li></ul>

</div>
<div style="position:absolute;left:var(--space-16);right:var(--space-16);bottom:var(--space-16);z-index:2"><ol class="counter" data-slot="stats"><li>01</li><li>02</li><li>03</li><li>04</li><li>05</li><li>06</li><li>07</li><li>08</li><li>09</li><li>10</li><li class="current">11</li></ol></div>
