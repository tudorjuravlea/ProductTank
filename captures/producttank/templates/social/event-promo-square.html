<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>event-promo · square</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="social-square" data-archetype="event-promo">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1080" width="1080" height="1080" aria-hidden="true"><circle class="fill-blurple" cx="1100" cy="700" r="200"/><circle class="stroke-zingy" cx="1040" cy="1000" r="188" stroke-width="24"/><circle class="stroke-zingy" cx="1040" cy="1000" r="132" stroke-width="24"/><circle class="stroke-zingy" cx="1040" cy="1000" r="76" stroke-width="24"/><circle class="fill-zingy" cx="1040" cy="1000" r="24"/><circle class="stroke-blurple" cx="760" cy="1120" r="207" stroke-width="26"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="hosted-by"><span class="caption medium">Hosted by</span><div class="sponsor-box caption" data-slot="sponsor-logo">Host logo</div></div>
<div class="copy" style="top: 320px">
  <div class="highlight" data-slot="highlight"><span>Tuesday 14 October, 18:30</span><span>Venue name, city</span></div>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6); font-size: 72px; max-width: 880px">When the ground is shifting but you're rearranging deck chairs</h1>
  <p class="subheading" data-slot="talk" style="margin-top: var(--space-5); max-width: 800px">How to stop layering AI on broken systems and rethink your product</p>
</div>
<div style="position:absolute;left:var(--space-16);bottom:var(--space-16);z-index:2;display:flex;flex-direction:column;gap:var(--space-5)" data-slot="lineup">
  <div class="speaker" data-slot="speaker"><div class="portrait" style="width:144px;height:144px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></div><div><p class="subheading bold" data-slot="speaker-name">Firstname Lastname</p><p class="body-sm" data-slot="role">Co-founder, data and AI strategy</p><p class="body-sm medium" data-slot="company">@ Acme</p></div></div>
  <p class="body-sm medium" data-slot="rsvp">Free to attend. RSVP on Meetup.</p>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
