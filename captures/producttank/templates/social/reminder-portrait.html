<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>reminder · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="reminder">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="560" cy="1080" r="460"/><circle class="stroke-zingy" cx="760" cy="560" r="282" stroke-width="36"/><circle class="stroke-zingy" cx="760" cy="560" r="198" stroke-width="36"/><circle class="stroke-zingy" cx="760" cy="560" r="114" stroke-width="36"/><circle class="fill-zingy" cx="760" cy="560" r="36"/><circle class="stroke-purple" cx="160" cy="900" r="282" stroke-width="36"/></svg>
<div class="copy">
  <span class="pill" data-slot="label">Last call</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">See you<br><span class="markup" data-markup="box">tomorrow</span></h1>
  <div style="margin-top: var(--space-8)"><ul class="facts subheading" data-slot="facts"><li>Tuesday 14 October</li><li>18:30</li></ul><ul class="facts subheading" data-slot="facts"><li>Venue name, Brussels</li></ul></div>
  <p class="body medium" data-slot="rsvp" style="margin-top: var(--space-6); max-width: 720px">A few spots left. RSVP on Meetup, and free yours up if you cannot make it.</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="380"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
