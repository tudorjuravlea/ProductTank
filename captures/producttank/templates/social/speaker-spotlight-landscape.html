<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>speaker-spotlight · landscape</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-landscape" data-archetype="speaker-spotlight">
<svg class="layer-shapes" data-derived-art="venn" data-venn="full,full,full" viewBox="0 0 1200 628" width="1200" height="628" aria-hidden="true"><circle class="fill-blurple" cx="924" cy="130" r="276"/><circle class="fill-purple" cx="1180" cy="560" r="190"/></svg>
<figure class="photo subject" data-slot="photo" style="right:64px;bottom:0;width:480px;height:600px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Speaker photo slot: a head-and-shoulders cut-out bleeding off the bottom edge" style="width:100%;height:100%;opacity:.18"></figure>
<svg class="shape" data-derived-art="shape" data-markup="sparkle" viewBox="0 0 225 225" preserveAspectRatio="none" fill="currentColor" style="position:absolute;left:600px;top:72px;width:112px;height:144px;color:var(--action);z-index:2" aria-hidden="true"><path fill="none" d="M40,190 L84,120" stroke="currentColor" stroke-width="22" stroke-linecap="round"/><path fill="none" d="M104,182 L118,100" stroke="currentColor" stroke-width="22" stroke-linecap="round"/><path fill="none" d="M166,196 L190,128" stroke="currentColor" stroke-width="22" stroke-linecap="round"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="330"></div>
<div class="copy" style="top: 216px; right: 560px">
  <span class="pill" data-slot="label">Community spotlight</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Firstname<br>Lastname</h1>
  <p class="subheading" data-slot="role" style="margin-top: var(--space-6)">Director of Product<br>@ Acme</p>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
