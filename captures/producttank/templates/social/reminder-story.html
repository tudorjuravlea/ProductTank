<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>reminder · story</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="story" data-archetype="reminder">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true"><circle class="fill-blurple" cx="1080" cy="1500" r="520"/><circle class="stroke-zingy" cx="320" cy="1300" r="320" stroke-width="41"/><circle class="stroke-zingy" cx="320" cy="1300" r="224" stroke-width="41"/><circle class="stroke-zingy" cx="320" cy="1300" r="129" stroke-width="41"/><circle class="fill-zingy" cx="320" cy="1300" r="41"/><circle class="stroke-purple" cx="900" cy="900" r="310" stroke-width="40"/></svg>
<div class="copy" style="top: var(--space-64)">
  <div class="lockup top" style="position:relative;left:0;top:0" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="480"></div>
  <span class="pill" data-slot="label" style="margin-top: var(--space-10); background: var(--white); color: var(--midnight)">Last call</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-8)">See you<br><span class="markup" data-markup="box">tomorrow</span></h1>
  <div class="highlight" data-slot="highlight" style="margin-top: var(--space-8)"><span>Tuesday 14 October</span><span>18:30</span></div>
  <p class="subheading" data-slot="rsvp" style="margin-top: var(--space-8)">A few spots left. RSVP on Meetup.</p>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
