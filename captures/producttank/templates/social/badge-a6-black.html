<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>badge · A6 · black</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="badge-a6" data-archetype="badge">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1240 1748" width="1240" height="1748" aria-hidden="true"><circle class="fill-blurple" cx="1240" cy="700" r="300"/><circle class="stroke-zingy" cx="160" cy="1300" r="244" stroke-width="31"/><circle class="stroke-zingy" cx="160" cy="1300" r="172" stroke-width="31"/><circle class="stroke-zingy" cx="160" cy="1300" r="99" stroke-width="31"/><circle class="fill-zingy" cx="160" cy="1300" r="31"/><circle class="stroke-purple" cx="1140" cy="1200" r="282" stroke-width="36"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="480"></div>
<div class="copy" style="top: 600px; text-align: left">
  <h1 class="headline" data-slot="headline">Firstname<br>Lastname</h1>
  <p class="subheading" data-slot="role" style="margin-top: var(--space-8)">Company or chapter</p>
</div>
<div style="position:absolute;left:var(--space-20);right:var(--space-20);bottom: 440px;z-index:2"><div data-slot="partners"><hr class="hairline"><p class="caption medium" style="margin-top: var(--space-5); letter-spacing: 0.08em; text-transform: uppercase">Hosted and supported by</p><ul class="partners" style="margin-top: var(--space-4)"><li>Host name</li><li>Partner name</li></ul></div></div>
<div class="badge-band" data-slot="label">Speaker</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
