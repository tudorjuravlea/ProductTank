<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>speaker-spotlight · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="speaker-spotlight">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="760" cy="1100" r="420"/><circle class="stroke-zingy" cx="300" cy="1010" r="226" stroke-width="29"/><circle class="stroke-zingy" cx="300" cy="1010" r="158" stroke-width="29"/><circle class="stroke-zingy" cx="300" cy="1010" r="91" stroke-width="29"/><circle class="fill-zingy" cx="300" cy="1010" r="29"/><circle class="stroke-purple" cx="1000" cy="700" r="282" stroke-width="36"/></svg>
<figure class="photo subject" data-slot="photo" style="right:0;bottom:0;width:640px;height:896px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Speaker photo slot: a head-and-shoulders cut-out bleeding off the bottom edge" style="width:100%;height:100%;opacity:.18"></figure>
<svg class="shape" data-derived-art="shape" data-markup="sparkle" viewBox="0 0 225 225" preserveAspectRatio="none" fill="currentColor" style="position:absolute;left:720px;top:352px;width:112px;height:144px;color:var(--action);z-index:2" aria-hidden="true"><path fill="none" d="M40,190 L84,120" stroke="currentColor" stroke-width="22" stroke-linecap="round"/><path fill="none" d="M104,182 L118,100" stroke="currentColor" stroke-width="22" stroke-linecap="round"/><path fill="none" d="M166,196 L190,128" stroke="currentColor" stroke-width="22" stroke-linecap="round"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 328px">
  <span class="pill" data-slot="label">Speaker</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Firstname<br>Lastname</h1>
  <p class="subheading" data-slot="role" style="margin-top: var(--space-6)">Director of Product, Acme</p>
  <p class="body" data-slot="talk" style="margin-top: var(--space-8); max-width: 520px">Talk title goes here, in sentence case, eight words at most</p>
</div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
