<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>recap-thanks · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="recap-thanks">
<figure class="photo textural" data-slot="photo"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Event photo slot: a full-bleed photo from the evening takes the tritone wash"></figure>
<svg class="layer-shapes" style="z-index:2;opacity:.9" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="900" cy="1200" r="300"/><circle class="stroke-zingy" cx="940" cy="260" r="188" stroke-width="24"/><circle class="stroke-zingy" cx="940" cy="260" r="132" stroke-width="24"/><circle class="stroke-zingy" cx="940" cy="260" r="76" stroke-width="24"/><circle class="fill-zingy" cx="940" cy="260" r="24"/><circle class="stroke-purple" cx="160" cy="700" r="207" stroke-width="26"/></svg>
<div class="copy">
  <span class="pill" data-slot="label">Recap</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Thank you,<br><span class="markup" data-markup="box">Belgium</span></h1>
  <div style="display:flex;gap:var(--space-24);margin-top: var(--space-12)" data-slot="stats">
    <div data-slot="stat"><p class="stat-number" style="font-size: var(--space-40)">84</p><p class="body">product people</p></div>
    <div data-slot="stat"><p class="stat-number" style="font-size: var(--space-40)">2</p><p class="body">talks</p></div>
  </div>
  <p class="body" data-slot="thanks" style="margin-top: var(--space-12); max-width: 760px">Thanks to our speakers and to our host for the room. Photos and slides are on the Meetup page.</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
