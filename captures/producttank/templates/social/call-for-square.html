<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>call-for · square</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-square" data-archetype="call-for">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1080" width="1080" height="1080" aria-hidden="true"><circle class="fill-blurple" cx="940" cy="900" r="360"/><circle class="stroke-zingy" cx="240" cy="880" r="207" stroke-width="26"/><circle class="stroke-zingy" cx="240" cy="880" r="145" stroke-width="26"/><circle class="stroke-zingy" cx="240" cy="880" r="84" stroke-width="26"/><circle class="fill-zingy" cx="240" cy="880" r="26"/><circle class="stroke-purple" cx="1000" cy="400" r="226" stroke-width="29"/></svg>
<div class="copy">
  <span class="pill" data-slot="label">Call for hosts</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-6)">Got a room<br>for <span class="markup" data-markup="box">80 people</span>?</h1>
  <p class="subheading" data-slot="body" style="margin-top: var(--space-8); max-width: 704px">Host an evening of ProductTank: a screen, some chairs, and your team on stage if you like.</p>
  <p class="body medium" data-slot="rsvp" style="margin-top: var(--space-8)">Message the organisers on Meetup.</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="380"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
