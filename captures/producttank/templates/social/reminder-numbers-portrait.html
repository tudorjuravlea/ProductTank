<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>reminder · portrait · twin numbers</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="reminder">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="1040" cy="1320" r="380"/><circle class="stroke-zingy" cx="100" cy="1200" r="207" stroke-width="26"/><circle class="stroke-zingy" cx="100" cy="1200" r="145" stroke-width="26"/><circle class="stroke-zingy" cx="100" cy="1200" r="84" stroke-width="26"/><circle class="fill-zingy" cx="100" cy="1200" r="26"/><circle class="stroke-purple" cx="1040" cy="500" r="244" stroke-width="31"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 360px">
  <span class="pill" data-slot="label">Last call</span>
  <div style="margin-top: var(--space-8)"><ul class="facts subheading" data-slot="facts"><li>Tuesday 14 October</li><li>18:30</li></ul><ul class="facts subheading" data-slot="facts"><li>Venue name, city</li></ul></div>
  <div class="twin" data-slot="stats" style="margin-top: var(--space-10)">
    <div><p class="hero-number">NN</p><p class="subheading">days left<br>to RSVP</p></div>
    <div><p class="hero-number">NN</p><p class="subheading">seats left<br>on Meetup</p></div>
  </div>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-10); font-size: 72px">Closing soon.</h1>
</div>
<div style="position:absolute;left:var(--space-16);right:var(--space-16);bottom:var(--space-16);z-index:2"><hr class="hairline"><p class="subheading bold" data-slot="rsvp" style="margin-top: var(--space-5)">Free to attend. RSVP on Meetup, or free your spot.</p></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
