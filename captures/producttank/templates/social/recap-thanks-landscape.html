<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>recap-thanks · landscape</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-landscape" data-archetype="recap-thanks">
<figure class="photo textural" data-slot="photo"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Event photo slot: a full-bleed photo from the evening takes the tritone wash"></figure>
<svg class="layer-shapes" style="z-index:2;opacity:.9" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1200 628" width="1200" height="628" aria-hidden="true"><circle class="fill-blurple" cx="1100" cy="560" r="200"/><circle class="stroke-zingy" cx="1000" cy="160" r="141" stroke-width="18"/><circle class="stroke-zingy" cx="1000" cy="160" r="99" stroke-width="18"/><circle class="stroke-zingy" cx="1000" cy="160" r="57" stroke-width="18"/><circle class="fill-zingy" cx="1000" cy="160" r="18"/><circle class="stroke-purple" cx="760" cy="600" r="160" stroke-width="20"/></svg>
<div class="copy" style="right: 480px">
  <span class="pill" data-slot="label">Recap</span>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-4)">Thank you,<br><span class="markup" data-markup="box">Brussels</span></h1>
  <p class="body" data-slot="thanks" style="margin-top: var(--space-6)">84 product people, two talks, one host to thank. Slides are on the Meetup page.</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="330"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
