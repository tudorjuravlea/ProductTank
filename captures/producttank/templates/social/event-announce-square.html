<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>event-announce · square</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas" data-format="social-square" data-archetype="event-announce">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1080" width="1080" height="1080" aria-hidden="true"><circle class="fill-blurple" cx="760" cy="1080" r="420"/><circle class="stroke-zingy" cx="810" cy="640" r="254" stroke-width="32"/><circle class="stroke-zingy" cx="810" cy="640" r="178" stroke-width="32"/><circle class="stroke-zingy" cx="810" cy="640" r="103" stroke-width="32"/><circle class="fill-zingy" cx="810" cy="640" r="32"/><circle class="stroke-purple" cx="1080" cy="1000" r="301" stroke-width="38"/></svg>
<figure class="photo subject" data-slot="photo" style="right:0;bottom:0;width:440px;height:760px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Subject photo slot: replace with a cut-out (transparent PNG) that bleeds off the edge" style="width:100%;height:100%;opacity:.18"></figure>
<div class="copy">

</div>
