<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>event-promo · portrait</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="social-portrait" data-archetype="event-promo">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="980" cy="1240" r="300"/><circle class="stroke-zingy" cx="520" cy="1260" r="207" stroke-width="26"/><circle class="stroke-zingy" cx="520" cy="1260" r="145" stroke-width="26"/><circle class="stroke-zingy" cx="520" cy="1260" r="84" stroke-width="26"/><circle class="fill-zingy" cx="520" cy="1260" r="26"/><circle class="stroke-blurple" cx="1000" cy="560" r="226" stroke-width="29"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 360px">
  <div class="highlight" data-slot="highlight"><span>Tuesday 14 October</span><span>18:30</span></div>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-8)">Saying no without losing the room</h1>
  <p class="subheading" data-slot="facts" style="margin-top: var(--space-6)">Venue name, city</p>
  <div style="margin-top: var(--space-10); display:flex; flex-direction:column; gap: var(--space-6)" data-slot="lineup">
    <div class="speaker" data-slot="speaker"><div class="portrait" style="width:112px;height:112px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></div><div><p class="subheading bold" data-slot="speaker-name">Firstname Lastname</p><p class="body-sm" data-slot="role">Head of Product</p><p class="body-sm medium" data-slot="company">@ Acme</p></div></div>
    <div class="speaker" data-slot="speaker"><div class="portrait" style="width:112px;height:112px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot for Firstname Lastname" style="opacity:.35"></div><div><p class="subheading bold" data-slot="speaker-name">Firstname Lastname</p><p class="body-sm" data-slot="role">Product manager</p><p class="body-sm medium" data-slot="company">@ Beta</p></div></div>
  </div>
  <p class="body medium" data-slot="rsvp" style="margin-top: var(--space-10)">Free to attend. RSVP on Meetup.</p>
</div>
<div style="position:absolute;left:var(--space-16);bottom:var(--space-16);z-index:3"><div class="sponsor-box caption" data-slot="sponsor-logo">Host logo</div></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
