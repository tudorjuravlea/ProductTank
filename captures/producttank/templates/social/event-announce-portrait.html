<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>event-announce · portrait</title>

<style></style></head><body>
<main class="canvas" data-format="social-portrait" data-archetype="event-announce">

<figure class="photo subject" data-slot="photo" style="right:0;bottom:0;width:520px;height:976px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Subject photo slot: replace with a cut-out (transparent PNG) that bleeds off the edge" style="width:100%;height:100%;opacity:.18"></figure>
