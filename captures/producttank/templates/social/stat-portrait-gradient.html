<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>stat · portrait · hero number · gradient</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-gradient" data-format="social-portrait" data-archetype="stat">
<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true"><circle class="fill-blurple" cx="1000" cy="1300" r="380"/><circle class="stroke-zingy" cx="1040" cy="300" r="207" stroke-width="26"/><circle class="stroke-zingy" cx="1040" cy="300" r="145" stroke-width="26"/><circle class="stroke-zingy" cx="1040" cy="300" r="84" stroke-width="26"/><circle class="fill-zingy" cx="1040" cy="300" r="26"/><circle class="stroke-purple" cx="120" cy="1250" r="244" stroke-width="31"/></svg>
<div class="lockup top" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="380"></div>
<div class="copy" style="top: 360px">
  <ul class="facts icons body medium" data-slot="facts"><li><svg viewBox="0 0 24 24" data-derived-art="icon" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Season 2026</span></li><li><svg viewBox="0 0 24 24" data-derived-art="icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Free to attend</span></li></ul>
  <p class="hero-number" data-slot="stats" style="margin-top: var(--space-6)">NN</p>
  <h1 class="headline" data-slot="headline" style="margin-top: var(--space-4); font-size: 72px">product people in the room last time.</h1>
  <p class="payoff" data-slot="body" style="margin-top: var(--space-4)">Numbers from Meetup, counted, never guessed.</p>
</div>
<div style="position:absolute;left:var(--space-16);right:var(--space-16);bottom:var(--space-16);z-index:2"><hr class="hairline"><div style="display:flex;justify-content:space-between;margin-top: var(--space-5)"><p class="subheading bold" data-slot="rsvp">Next one on Meetup.</p><p class="subheading" data-slot="label" style="opacity:.7; white-space:nowrap">Meetup NN</p></div></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
