<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>slide · speaker</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="slide" data-archetype="slide-speaker">

<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"><circle class="stroke-blurple" cx="900" cy="1060" r="207" stroke-width="26"/><circle class="stroke-purple" cx="900" cy="1060" r="145" stroke-width="26"/><circle class="stroke-blurple" cx="900" cy="1060" r="84" stroke-width="26"/><circle class="fill-blurple" cx="1900" cy="200" r="220"/><circle class="stroke-purple" cx="1760" cy="1060" r="226" stroke-width="29"/></svg>
<div class="copy" style="top: 300px; right: 1040px">
  <span class="pill blurple" data-slot="label">Talk 1</span>
  <h1 class="slide-title" data-slot="headline" style="margin-top: var(--space-8); position: relative; display: inline-block">Today's speaker<svg class="shape" data-derived-art="shape" data-markup="underline" viewBox="0 0 400 18" preserveAspectRatio="none" fill="currentColor" style="position:absolute;left:0;bottom:-28px;width:520px;height:22px;color:var(--action)" aria-hidden="true"><path d="M-0.6,6.2 L200.1,2.9 L400.6,4.5 L401.2,11.1 L199.8,16.6 L-0.8,13.0 Z"/></svg></h1>
</div>
<div style="position:absolute;right:160px;top:240px;z-index:2;width:640px" data-slot="lineup">
  <div class="speaker" style="flex-direction:column;align-items:flex-start;gap:var(--space-6)" data-slot="speaker"><div class="portrait" style="width:360px;height:360px"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Portrait slot" style="opacity:.35"></div><div><p class="heading" data-slot="speaker-name" style="font-size: var(--space-12)">Firstname Lastname</p><p class="subheading" data-slot="role">Head of Product</p><p class="subheading medium" data-slot="company">@ Acme</p></div></div>
  <p class="slide-body medium" data-slot="talk" style="margin-top: var(--space-8)">Saying no without losing the room</p>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="300"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
