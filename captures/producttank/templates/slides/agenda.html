<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>slide · agenda</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="slide" data-archetype="slide-agenda">

<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"><circle class="stroke-blurple" cx="1700" cy="300" r="282" stroke-width="36"/><circle class="stroke-purple" cx="1700" cy="300" r="198" stroke-width="36"/><circle class="stroke-blurple" cx="1700" cy="300" r="114" stroke-width="36"/><circle class="fill-zingy" cx="1900" cy="1080" r="120"/><circle class="stroke-blurple" cx="1000" cy="1100" r="188" stroke-width="24"/></svg>
<div class="copy" style="right: 720px">
  <span class="pill blurple" data-slot="label">Tonight's meetup</span>
  <h1 class="slide-title" data-slot="headline" style="margin-top: var(--space-8)">Tonight</h1>
  <ol class="slide-body" data-slot="agenda" style="list-style:none;padding:0;margin: var(--space-10) 0 0;max-width: 1000px">
    <li style="display:flex;gap:var(--space-8);padding: var(--space-4) 0;border-bottom: 2px solid var(--blurple)"><span class="bold" style="width:160px">18:00</span><span>Doors open, drinks and networking</span></li>
    <li style="display:flex;gap:var(--space-8);padding: var(--space-4) 0;border-bottom: 2px solid var(--blurple)"><span class="bold" style="width:160px">18:30</span><span>Welcome from the organisers</span></li>
    <li style="display:flex;gap:var(--space-8);padding: var(--space-4) 0;border-bottom: 2px solid var(--blurple)"><span class="bold" style="width:160px">18:40</span><span>Talk 1: Saying no without losing the room</span></li>
    <li style="display:flex;gap:var(--space-8);padding: var(--space-4) 0;border-bottom: 2px solid var(--blurple)"><span class="bold" style="width:160px">19:15</span><span>Talk 2: What our onboarding data got wrong</span></li>
    <li style="display:flex;gap:var(--space-8);padding: var(--space-4) 0"><span class="bold" style="width:160px">19:50</span><span>Questions, then more networking</span></li>
  </ol>
</div>
<div style="position:absolute;right:var(--space-24);bottom:var(--space-24);z-index:3;display:flex;align-items:center;gap:var(--space-6)"><span class="body-sm">Thank you to our host</span><div class="sponsor-box caption" data-slot="sponsor-logo">Host logo</div></div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="300"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
