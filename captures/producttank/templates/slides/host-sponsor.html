<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>slide · host and sponsors</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="slide" data-archetype="slide-host-sponsor">

<svg class="layer-shapes" data-derived-art="venn" data-venn="target,full,ring" viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true"><circle class="stroke-blurple" cx="1760" cy="200" r="207" stroke-width="26"/><circle class="stroke-purple" cx="1760" cy="200" r="145" stroke-width="26"/><circle class="stroke-blurple" cx="1760" cy="200" r="84" stroke-width="26"/><circle class="fill-zingy" cx="1840" cy="1040" r="220"/><circle class="stroke-blurple" cx="1500" cy="1000" r="207" stroke-width="26"/></svg>
<div class="copy">
  <span class="pill blurple" data-slot="label">Sponsorship</span>
  <h1 class="slide-title" data-slot="headline" style="margin-top: var(--space-8)">Thanks to our host</h1>
  <div style="margin-top: var(--space-10)"><div class="sponsor-box caption" data-slot="sponsor-logo">Host logo</div></div>
  <p class="subheading" data-slot="body" style="margin-top: var(--space-16)">Supported by</p>
  <div style="display:flex;gap:var(--space-8);margin-top: var(--space-6)" data-slot="sponsors"><div class="sponsor-box caption" data-slot="sponsor-logo">Sponsor logo</div><div class="sponsor-box caption" data-slot="sponsor-logo">Sponsor logo</div><div class="sponsor-box caption" data-slot="sponsor-logo">Sponsor logo</div></div>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-brussels-white.svg" alt="ProductTank Brussels, a Mind the Product meetup" width="300"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
