<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>slide · welcome</title>
<link rel="stylesheet" href="../../fonts/fonts.css"><link rel="stylesheet" href="../../assets/tokens.css"><link rel="stylesheet" href="../../assets/base.css">
<style></style></head><body>
<main class="canvas ground-black" data-format="slide" data-archetype="slide-welcome">

<figure class="photo textural" data-slot="photo" style="left:0;top:0;width:100%;height:100%"><img src="../../assets/shapes/photo-slot-subject.svg" alt="Textural photo slot: a scene from a past evening, full-bleed, takes the tritone wash" style="width:100%;height:100%;opacity:.18"></figure>
<div class="copy" style="top: 120px; left: 0; right: 0; text-align: center">
  <img src="../../assets/logo/mtp-wordmark-placeholder-white.svg" alt="Mind the Product" width="220" style="display:inline-block" data-slot="cobrand">
</div>
<div class="copy" style="top: 360px; left: 240px; right: 240px; text-align: center">
  <h1 class="slide-title" data-slot="headline" style="font-size: var(--space-14)">Our mission is to foster collaboration and growth within local product management communities to drive innovation and <span class="underline-markup">excellence.</span></h1>
</div>
<div class="lockup bottom" data-slot="lockup"><img src="../../assets/logo/producttank-placeholder-white.svg" alt="ProductTank Belgium, a Mind the Product meetup" width="300"></div>
</main><script>document.fonts.ready.then(() => document.querySelector('.canvas').setAttribute('data-render-ready', ''));</script></body></html>
